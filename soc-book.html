 ["h", "Woh fields jinhe pehchanna zaroori hai"],
 ["tbl", ["Field", "Matlab", "Analyst ka sawal"], [
  ["Timestamp", "Waqia kab hua, aksar time zone ke sath.", "UTC hai ya local? Kya sources mel khate hain?"],
  ["Source IP / port", "Connection kahan se aaya.", "Internal ya external? Jaana pehchana ya naya?"],
  ["Destination IP / port", "Kahan gaya.", "Kaun si service? Is host ke liye mutawaqqe?"],
  ["Username", "Shamil account.", "Insaan, service ya system? Sahi shakhs?"],
  ["Hostname", "Woh machine jis ne event banaya ya jis par asar hua.", "Iska role aur ahmiyat kya hai?"],
  ["Process / command line", "Program aur uske arguments.", "Jaiz program? Ajeeb arguments?"],
  ["Action / status", "Allowed, denied, success, failure.", "Kya koshish kamyab hui?"],
  ["Event ID", "Event ki qism ka adadi code.", "Yeh ID asal mein kya batati hai?"],
  ["User agent", "HTTP mein client software ka dawa.", "Browser, script ya tool? Jaali ho sakta hai."]]],
 ["warn", "Waqt ghalat nateejon ki sab se aam wajah hai. Timeline banane se pehle hamesha time zones ek karein aur clock drift ka khayal rakhein."],
 ["h", "Achhi log aadatein"],
 ["ul", ["Poora event parhein, sirf sarkhi nahi. Ahem tafseel aksar neeche ki field mein hoti hai.", "Yeh poochein ke **kya gayab hai**. Pehle failures ke baghair logon success normal ho sakta hai; parent ke baghair process start logging ke nuqsan ka ishara ho sakta hai.", "Log ki mukammal honay ki tasdeeq karein: kya source waqai bhej raha hai?", "Kacha (raw) event mehfooz rakhein. Parsed fields ghalat ho sakti hain."]]

E.push({ id: "c-readlogs", title: "Logs Ko Line by Line Parhna", intro: "Farzi lekin haqeeqi jaisi misalein.", blocks: [
 ["p", "Log ko waise parhna seekhein jaise jumla parhte hain: fail (subject), amal (verb), maful (object), nateeja. Har misal neeche line by line samjhayi gayi hai. Sab addresses documentation ranges se hain."],
 ["log", "Windows failed logon (Event ID 4625, mukhtasar)", "EventID=4625  TimeCreated=2026-03-14T09:12:41Z  Computer=WS-ACC-07\nTargetUserName=j.khan  TargetDomainName=CORP\nLogonType=3  IpAddress=203.0.113.50  IpPort=51322\nStatus=0xC000006D  SubStatus=0xC000006A  AuthenticationPackageName=NTLM", ["Event 4625 host WS-ACC-07 par 09:12:41 UTC par failed logon hai.", "Account CORP\\j.khan par koshish hui. Naam maujood hai lekin logon qabool nahi hua.", "Logon type 3 network logon hai, aur source 203.0.113.50 external lagta hai. Workstation par internet se network logon ghair-mamooli hai.", "Status 0xC000006D matlab logon nakam; sub-status 0xC000006A matlab valid user ka password ghalat. NTLM istemal hua."]],
 ["log", "Linux SSH failures (auth.log)", "Mar 14 02:11:03 web01 sshd[2214]: Failed password for invalid user admin from 198.51.100.23 port 40122 ssh2\nMar 14 02:11:05 web01 sshd[2216]: Failed password for root from 198.51.100.23 port 40130 ssh2\nMar 14 02:11:09 web01 sshd[2220]: Accepted password for deploy from 198.51.100.23 port 40144 ssh2", ["\u201cinvalid user admin\u201d ka matlab server par yeh account maujood nahi; attacker naam ka andaza laga raha hai.", "Do second baad usi source se `root` ki koshish. Ek IP se seconds mein alag usernames automation hai.", "**Deploy ka login kamyab hua** usi IP se. Ab sab kuch badal gaya: pehle ke failures ab kamyab brute force lagte hain. Escalate karein aur dekhein `deploy` ne agla kya kiya."]],
 ["log", "Firewall (farzi format)", "2026-03-14T10:02:11Z ACTION=ALLOW SRC=10.20.5.44 SPT=49712 DST=203.0.113.77 DPT=443 PROTO=TCP BYTES_OUT=48211988 BYTES_IN=5210\n2026-03-14T10:02:12Z ACTION=DENY SRC=198.51.100.9 SPT=51000 DST=10.20.1.10 DPT=3389 PROTO=TCP", ["Internal host ne HTTPS par taqreeban 48 MB bahar bheja aur sirf 5 KB wapas aaya. Download se bohat zyada upload exfiltration ka ishara ho sakta hai; destination aur user ki activity verify karein.", "External address ne internal server par RDP try kiya aur block hua. Yeh scan ka shor hai jab tak bohat se hosts par dohraya na jaye ya baad mein ALLOW na ho jaye."]],
 ["log", "Web server access log", "203.0.113.90 - - [14/Mar/2026:10:15:22 +0000] \"GET /products.php?id=5' OR '1'='1 HTTP/1.1\" 200 5432 \"-\" \"sqlmap/1.7\"\n203.0.113.90 - - [14/Mar/2026:10:15:23 +0000] \"GET /products.php?id=5 UNION SELECT username,password FROM users-- HTTP/1.1\" 500 312 \"-\" \"sqlmap/1.7\"", ["Parameter mein quote aur OR shart, HTTP status 200, aur user agent mein mashhoor testing tool ka naam: SQL injection probing ka imkan.", "UNION SELECT ki koshish par 500 error aaya. Server ne error diya, jis ka matlab aksar application ne hamla mehsoos kiya lekin phir bhi maloomat leak ho sakti hain; database aur application logs dekhein."]],
 ["log", "DNS query log", "10:20:01 client=10.20.5.44 query=a9f3kd82lqz7x.example-cdn.top type=TXT rcode=NOERROR\n10:20:31 client=10.20.5.44 query=b1c7pq02mzx9d.example-cdn.top type=TXT rcode=NOERROR", ["Ek workstation kam istemal hone wale top-level domain ke neeche random naam par TXT query karti hai.", "Tees second baad usi domain ke neeche doosra random naam. Baqaida waqfe aur random labels DNS-based command and control ya tunnelling ki nishani hain; domain ki umar aur kitne hosts query karte hain check karein."]],
 ["log", "VPN authentication", "2026-03-14 03:41:09 user=m.ali result=SUCCESS src=192.0.2.140 country=RO device=unknown mfa=none\n2026-03-14 03:41:15 user=m.ali result=SUCCESS src=192.0.2.140 country=RO device=unknown mfa=none", ["User m.ali aise mulk se login karta hai jo uska aam nahi, anjaan device se, MFA ke baghair, raat 03:41 par.", "Chhe second baad doosra login automation ya credential replay ka ishara hai. User ki pichli logins se muwazna karein aur alag channel se user se tasdeeq karein."]],
 ["tip", "Log parhne ke baad ek jumla likhein: **kis ne kya kiya, kis par, kahan se, kab, kis nateeje ke sath.** Agar nahi likh sakte to aap ne line abhi samjhi nahi."]
]});
E.push({ part: true, n: "06", title: "SIEM", blurb: "Woh platform jo sab evidence ek jagah jama karta hai, aur analysts us se sawal kaise poochte hain." });
E.push({ id: "c-siem", title: "SIEM Concepts", intro: "Ingestion, parsing, correlation, alerts aur prioritisation.", blocks: [
 ["h", "SIEM kya hai aur kyun hai"],
 ["p", "Security Information and Event Management (SIEM) bohat se sources se logs jama karta hai, unhe normalise karta hai, store karta hai, analysts ko search karne deta hai aur rule match hone par alerts banata hai. Organisations SIEM isliye istemal karti hain ke incident ke dauran koi analyst sau systems mein login nahi kar sakta. Ek jagah, ek timeline, ek search."],
 ["h", "Data ka bahao"],
 ["flow", ["Ingestion", "Parsing", "Normalisation", "Enrichment", "Storage", "Correlation", "Alerting", "Dashboards"]],
 ["ul", ["**Ingestion** \u2014 agents, forwarders, syslog, APIs aur cloud connectors events andar lete hain.", "**Parsing** \u2014 raw text ko `src_ip` aur `user` jaisi fields mein torna.", "**Normalisation** \u2014 alag vendors ke field names ko common schema se jorna taake ek query sab par chale.", "**Enrichment** \u2014 context jorna: asset owner, geolocation, threat-intelligence match.", "**Correlation** \u2014 waqt aur sources ke par events ko milana: maslan failed logins ke baad usi IP se success.", "**Alerting** \u2014 rule ki shartein poori hone par case banana."]],
 ["h", "Detection rules"],
 ["tbl", ["Qism", "Khayal", "Misaal"], [
  ["Threshold", "Waqt ki window mein ginti hadd se barh jaye.", "Ek account ke 5 minute mein 20 se zyada failed logons."],
  ["Correlation", "Events ya sources ki tarteeb.", "Naye mulk se VPN login ke baad mailbox rule ki tashkeel."],
  ["Signature / IOC", "Maloom indicator se milan.", "Threat feed ke IP se connection."],
  ["Behavioural / anomaly", "Baseline se hatna.", "User aam se das guna zyada download kare."]]],
 ["h", "Severity, priority aur false positives"],
 ["p", "**Severity** batati hai detection kitni buri ho sakti hai. **Priority** severity ko asset ki ahmiyat, confidence aur karobari context se mila kar tay karti hai ke pehle kya dekha jaye. Bohat se detections false positives hote hain. Tuning shor kam karti hai lekin SIEM ko andha nahi karti, aur har tuning ka faisla document hona chahiye (False Positives chapter dekhein)."],
 ["h", "Aam platforms"],
 ["tbl", ["Platform", "Query language / andaz", "Notes"], [
  ["Splunk", "SPL (search processing language)", "Pipe par mabni; mazboot search; index aur sourcetype ke concepts."],
  ["Microsoft Sentinel", "KQL (Kusto Query Language)", "Cloud-native, Microsoft 365 aur Azure se juda."],
  ["Elastic Security", "KQL/Lucene, EQL, ES|QL", "Elasticsearch par bana; ECS field schema."],
  ["IBM QRadar", "AQL (Ariel Query Language), offences", "Events ko offences mein guroh karta hai; flows aur log sources istemal karta hai."]]],
 ["warn", "Yeh platforms aapas mein **badalne ke qabil nahi**. Syntax, field names aur behaviour alag hain. Agle chapter ki misalein khayalat dikhati hain, aapke mahol ke liye copy-paste queries nahi."]
]});
E.push({ id: "c-siemq", title: "SIEM Queries aur Investigations", intro: "Numainda queries, har ek kya dhoondti hai aur nateeje kaise parhein.", blocks: [
 ["note", "Neeche field aur index names misali hain. Kisi bhi query ko istemal karne se pehle apne SIEM ka schema check karein."],
 ["h", "Source ke hisab se failed logons (Splunk SPL)"],
 ["cmd", "SPL: ek source se bohat failures", "index=wineventlog EventCode=4625\n| stats count dc(TargetUserName) as accounts by IpAddress\n| where count > 20\n| sort - count", "**Yeh kya dhoondti hai:** Windows failed logons, har source IP ke hisab se ginti aur kitne alag accounts nishana bane. **Kya dekhein:** ek IP bohat se accounts par ho to password spraying; ek IP ek account par ho to brute force. **Shak ka matlab:** sirf ginti saboot nahi; usi IP se baad ka success (4624) check karein."],
 ["h", "Failure ke baad success (Microsoft Sentinel KQL)"],
 ["cmd", "KQL: failures ke baad success", "SigninLogs\n| where TimeGenerated > ago(1d)\n| summarize Failures=countif(ResultType != 0), Successes=countif(ResultType == 0) by UserPrincipalName, IPAddress\n| where Failures > 10 and Successes > 0", "**Yeh kya dhoondti hai:** pichle ek din mein har user aur IP ke cloud sign-ins. **Kya dekhein:** aise accounts jin ke bohat failures aur usi address se kam az kam ek success ho. **Matlab:** kamyab andaze ka imkan; MFA result, device aur location dekhein."],
 ["h", "Shak wali PowerShell (Elastic KQL)"],
 ["cmd", "Elastic KQL: encoded PowerShell", "process.name : \"powershell.exe\" and process.command_line : (*-enc* or *-EncodedCommand* or *DownloadString*)", "**Yeh kya dhoondti hai:** encoded ya download se mutaliq arguments ke sath chalne wali PowerShell. **Kya dekhein:** parent process (Office ya browser shak wala hai), user aur foran baad koi network connection. **Matlab:** kuch management tools encoding jaiz tor par karte hain, is liye manzoor-shuda software se muwazna karein."],
 ["h", "Beaconing ka umeedwar (QRadar AQL)"],
 ["cmd", "AQL: baar baar outbound connections", "SELECT sourceip, destinationip, COUNT(*) AS c\nFROM events\nWHERE starttime > NOW() - 3600000 AND destinationip NOT IN (SELECT ip FROM internal_ranges)\nGROUP BY sourceip, destinationip HAVING c > 100\nORDER BY c DESC", "**Yeh kya dhoondti hai:** woh external destinations jin se ek internal host ne ek ghante mein 100 se zyada dafa raabta kiya. **Kya dekhein:** baqaida waqfe aur chhote yaksan size ke transfers. **Matlab:** update services aur telemetry bhi beacon karte hain, isliye tasdeeq ke baad unhe allow-list karein."],
 ["h", "SIEM ke andar tehqeeq ka tareeqa"],
 ["ol", ["Alert aur rule ka logic parhein. Asal mein kya match hua?", "Entities pehchanein: user, host, IP, process.", "Pivot karein: har entity ko alert se pehle aur baad ki window mein search karein.", "Ek time zone mein timeline banayein.", "Success, phailao aur persistence check karein.", "Baseline aur maloom change activity se muwazna karein.", "Faisla, amal aur documentation, jis mein aap ki chalayi hui queries bhi shamil hon."]],
 ["tip", "Case notes mein woh queries aur time ranges likhein jo aapne istemal kin. Jis tehqeeq ko dohraya na ja sake us ka review nahi ho sakta."]
]});
})();

E.push({ part: true, n: "07", title: "MITRE ATT&CK", blurb: "Attackers ke kaam ki mushtarka zubaan, aur defenders ke liye naqsha ke kya detect karna chahiye." });
E.push({ id: "c-attck", title: "Analysts Ke Liye MITRE ATT&CK", intro: "Tactics, techniques, procedures aur tehqeeq mein unka istemal.", blocks: [
 ["h", "ATT&CK kya hai"],
 ["p", "MITRE ATT&CK attackers ke behaviour ka public knowledge base hai, jo asal duniya ke mushahidon par mabni hai. Yeh tool ya checklist nahi; yeh mushtarka zubaan hai. Jab do analysts \u201cT1110 Brute Force\u201d kehte hain to dono ka matlab ek hota hai, chahe alert kisi bhi product ne diya ho."],
 ["tbl", ["Concept", "Matlab", "Misaal"], [
  ["**Tactic**", "Us marhale par attacker ka maqsad \u2014 \u201ckyun\u201d.", "Credential Access"],
  ["**Technique**", "Maqsad kaise hasil hota hai \u2014 \u201ckaise\u201d.", "T1110 Brute Force"],
  ["**Sub-technique**", "Zyada khaas qism.", "T1110.003 Password Spraying"],
  ["**Procedure**", "Kisi khaas actor ya tool ka asal tareeqa.", "Ek tool jo ek password bohat se accounts par aazmata hai"]], { w: [0.2, 0.45, 0.35] }],
 ["h", "Woh tactics jo analyst ko aani chahiye"],
 ["tbl", ["Tactic", "Attacker ka maqsad", "Defenders ko kya nazar aa sakta hai"], [
  ["Initial Access", "Pehla qadam jamana.", "Phishing mail, exploit hui public app, churaye hue credentials, VPN login"],
  ["Execution", "Malicious code chalana.", "Office se PowerShell, script hosts, ghair-mamooli command lines"],
  ["Persistence", "Reboot ya password badalne ke baad bhi rehna.", "Nayi service, scheduled task, Run key, naya account, SSH key"],
  ["Privilege Escalation", "Zyada rights lena.", "Group membership changes, token ka ghalat istemal, 4672 special privileges"],
  ["Defense Evasion", "Pakde jane se bachna.", "Log clearing (1102), AV band, naqli naam, obfuscated scripts"],
  ["Credential Access", "Credentials churana.", "LSASS access, Kerberoasting, brute force, password dumping"],
  ["Discovery", "Mahol ko samajhna.", "`net`, `whoami`, `nltest`, LDAP enumeration, port scans"],
  ["Lateral Movement", "Doosre systems tak jana.", "Workstations ke darmiyan SMB/RDP/WinRM, remote service creation (7045)"],
  ["Collection", "Dilchasp data jama karna.", "Archives ka banna, bohat files ka parha jana, mailbox exports"],
  ["Command and Control", "Compromised hosts se raabta.", "Beaconing, rare domains, DNS tunnelling, ghair-mamooli ports"],
  ["Exfiltration", "Data bahar nikalna.", "Bari uploads, cloud storage uploads, ajeeb waqt par transfers"],
  ["Impact", "Rukawat, tabahi ya fidya.", "Mass file encryption, backups ka hatna, service stop, wipers"]], { w: [0.2, 0.28, 0.52], firstBold: true }],
 ["h", "SOC analysts ATT&CK kaise istemal karte hain"],
 ["ul", ["Alert ko **classify** karein: \u201cyeh T1059.001 PowerShell ke zariye Execution hai.\u201d", "**Agla qadam pehchanein.** Credential Access ke baad Lateral Movement ya Privilege Escalation ki tawaqqo rakhein, taake pata ho kahan dekhna hai.", "**Scope tay karein.** Alert se pehle aur baad ke tactics search karein taake dekha ja sake baat kahan tak gayi.", "**Coverage napein.** Detection engineers rules ko techniques se map karke blind spots dhundte hain.", "**Baat karein.** Technique IDs wale reports aur escalations mein ibham nahi hota."]],
 ["h", "Detection aur mitigation"],
 ["p", "Har technique ke page par woh data sources hote hain jo use pakad sakte hain aur mitigations jo use kam karti hain. Unhe shuruati checklist ki tarah istemal karein: agar technique \u201cScheduled Task\u201d hai to data source process creation aur scheduled-task events hain, aur mitigation yeh ke tasks banane wale kam kiye jayen."],
 ["warn", "ATT&CK batata hai kya **mumkin** hai, yeh nahi ke aapke case mein kya **sabit** hua. Sirf woh techniques map karein jinka aapke paas evidence ho, aur ghair-yaqeeni mapping ko wazeh tor par ghair-yaqeeni likhein."],

E.push({ part: true, n: "08", title: "Aam Attacks", blurb: "Attayees attack qismein, har ek ek hi tarah samjhayi gayi taake aap unka muqabla aur systematic tehqeeq kar saken." });
E.push({ id: "c-atk1", title: "Phishing aur Credential Attacks", intro: "Logon aur passwords par hamle.", blocks: [
 ["p", "Is part ka har table wohi pandrah nukat follow karta hai, attack kya hai se le kar ATT&CK mapping tak. Inhe zehni checklist ki tarah istemal karein. Sab techniques detection aur bachao ke liye bayan hui hain."],
 A("Phishing", [
  "Jaali messages jo recipient ko click karne, kholne ya jawab dene par majboor karte hain.",
  "Attacker kisi mashhoor brand ki naqal mein bulk email bhejta hai; link ya attachment credential chori ya malware tak le jata hai.",
  "Jaldi ka andaz, sender aur display name ka farq, look-alike domain, generic salam, ghair-mutawaqqe attachment.",
  "Mail gateway logs (sender, subject, URL, verdict), click ke liye proxy logs, domain ke liye DNS.",
  "Email security detection, user ki report, naye registered domain par proxy alert.",
  "Headers aur SPF/DKIM/DMARC parhein, URL/attachment ko mehfooz tareeqe se chalayein, baqi recipients aur clicks dhundein, baad mein credentials ka istemal dekhein.",

  "Mailboxes se email hatayein, sender/domain/URL block karein, credentials daale gaye ho to reset, payload chala ho to host isolate.",
  "Sari copies hatayein, malware aur persistence saaf karein, sessions aur tokens revoke.",
  "Mailbox rules aur accounts normal karein, agle activity ki nigrani.",
  "Timeline, recipients, actions aur indicators ke sath ticket; IOCs blocklist mein.",
  "Credentials daale gaye, payload chala, executives nishana bane ya bohat users ne click kiya to escalate.",
  "Email authentication, filtering, awareness training, report button, MFA.",
  "T1566 Phishing (.001 attachment, .002 link)"]),

  "Kisi ek shakhs ya team ke liye khaas banaya gaya phishing.",

  "Sahi naam aur context, reply-to alag, payment badalne ya jaldi file ki darkhwast.",
  "Phishing jaisa hi, lekin kam recipients aur aksar bulk pattern nahi.",
  "Aksar khudkar alert nahi hota. User ya finance ki report asal signal hai.",
  "Kahe gaye sender se alag channel par tasdeeq karein, headers aur domain ki umar dekhein, email ke baad bane mailbox rules dekhein.",
  "Aam phishing se zyada kyunke nishana banana irade ka ishara hai; executives ya finance shamil hon to critical.",

  "Mutasir karobari process aur kiye gaye faislon ko likhein.",

  "Payment verification ke tareeqe, external-sender banners, DMARC, executive briefings.",
  "T1566.001/.002/.003 Spearphishing"]),
 A("Credential Phishing", [
  "Aisa phishing jis ka maqsad username, password ya MFA code hasil karna hai.",
  "Jaali login page asal service ki naqal karta hai; daali gayi tafseel attacker ko jati hai, kabhi live proxy ke zariye session bhi pakda jata hai.",
  "Anjaan domain par login form wala link, brand logos, \u201caccount lock ho gaya\u201d jaisi jaldi.",
  "Phishing site ke proxy logs, identity provider mein chand der baad naye location se login.",
  "Impossible-travel, naye device ka login, phish report ke baad shak wala sign-in.",
  "Tasdeeq karein user ne credentials daale ya nahi, click ke baad us user ke sign-ins, naye MFA methods aur inbox rules dekhein.",
  "Credentials daale gaye to high, privileged account ho to critical.",
  "Page ka URL aur screenshot, proxy logs, identity sign-in logs, MFA registration events.",
  "Password reset, sessions aur tokens revoke, URL block, attacker ke rules band.",
  "Ghair-mujaz MFA methods, devices aur app consents hatayein.",
  "Account dobara chalu, sign-ins ki nigrani, tasdeeq ke data tak access nahi hua.",
  "User, exposure ki muddat aur dekha gaya access likhein.",
  "Attacker ka koi kamyab login mile to identity team aur incident response ko escalate.",
  "Phishing-resistant MFA (FIDO2), conditional access, user training.",
  "T1566.002, T1539 Steal Web Session Cookie, T1556 Modify Authentication Process"]),
 A("Brute Force", [
  "Ek account ya service par baar baar password ke andaze.",
  "Khudkar tools bohat tezi se passwords aazmate hain is umeed par ke koi mil jaye.",
  "Ek account ke bohat failures, ek ya chand sources se; achanak lockouts.",
  "Windows 4625 aur 4740, SSH \u201cFailed password\u201d, VPN aur web login failures.",

  "Source aur target account ke hisab se guroh banayein, waqt dekhein, failures ke baad success aur MFA ka nateeja check karein.",

 A("Password Spraying", [

 A("Credential Stuffing", [

  "**Geolocation aur context:** kya source ki jagah user se mel khati hai? Safar, remote work ya change window?",
  "**Kamyab login ki jaanch:** usi source ya account se baad mein 4624, VPN ya app success dhundein. Yeh sab se ahem qadam hai.",
  "**MFA ki jaanch:** MFA maanga gaya, guzra, bypass hua ya tha hi nahi?",
  "**Endpoint correlation:** kamyab login ke baad account ne kya kiya: naye processes, file access, mailbox rules?",
  "**Wajah tay karein:** brute force (ek account), password spraying (bohat accounts, har par kam koshish) ya jaiz user/misconfigured service.",
  "**Severity, containment, escalation aur documentation:** severity aur documentation ke chapters dekhein. Sources block, success ho to accounts reset, kisi success ya privileged target par escalate."]],
 ["h", "Playbook 2 \u2014 Phishing Investigation"],
 ["flow", ["Email", "Sender", "Headers", "Domain", "SPF/DKIM/DMARC", "URLs", "Attachments", "Sandbox", "Endpoint", "Credentials", "Lateral", "Contain", "Reset", "IOCs", "Document"]],
 ["ol", [
  "**Email mili:** asal message (.eml) lein, screenshot nahi. Pata karein kis ne report kiya aur aur kis ko mili.",
  "**Sender aur headers:** display name, From, Reply-To aur Return-Path muwazna karein; Received chain neeche se upar parhein.",
  "**Domain ka jaiza:** registration ki tareekh, look-alike characters, hosting. Chand din purana domain mazboot signal hai.",
  "**SPF, DKIM, DMARC:** authentication results parhein. Look-alike domain par pass hona bhi shak wala hai.",
  "**URLs:** apni workstation se kabhi click na karein. Mehfooz URL analysis service ya sandbox istemal karein; redirects aur asal manzil dekhein.",
  "**Attachments:** hash, type, macros ya scripts; sandbox mein chalayein, production device par nahi.",
  "**Endpoint activity:** kisi ne click ya open kiya? Mail client se processes, downloads aur naye connections dekhein.",
  "**Credential ka istemal:** jis ne credentials daale uske baad ke sign-ins, naye inbox rules, MFA changes aur consent grants dekhein.",
  "**Lateral movement:** dekhein compromised account kahin aur authenticate to nahi hua.",
  "**Containment:** mail hatayein, domain, URL aur hash block, passwords reset, tokens revoke, mutasir hosts isolate.",
  "**IOC jama karna aur documentation:** domains, IPs, URLs, hashes, sender addresses aur subjects likhein aur tay shuda channel se share karein."]],
 ["h", "Playbook 3 \u2014 Malware Investigation"],
 ["flow", ["Alert", "Process tree", "Parent", "Command line", "Hash", "Path", "Network", "DNS", "Persistence", "Users/hosts", "Contain", "Eradicate", "Recover", "Hunt"]],
 ["ol", [
  "**Alert:** kis ne pakda, aur block kiya ya sirf alert diya? Download par block hona execute hone se bilkul alag hai.",
  "**Process tree aur parent process:** file kaise shuru hui? Office ne script host chalaya, browser ne installer, wagaira.",
  "**Command line aur file path:** arguments, encoded content, Temp, AppData ya Downloads se chalna.",
  "**Hash:** reputation aur internal prevalence dekhein; saaf reputation ko \u201canjaan\u201d samjhein, \u201cmehfooz\u201d nahi.",
  "**Network connections aur DNS:** destinations, ports, frequency, domain ki umar.",
  "**Persistence:** Run keys, services, scheduled tasks, startup folders, WMI.",
  "**Mutasir users aur endpoints:** hash, path, domain aur command line poore network mein search karein.",
  "**Containment:** hosts isolate, hash aur destination block, khule accounts disable.",
  "**Eradication aur recovery:** asaar hatayein, entry point patch, bharosa toot jaye to reimage, host par istemal credentials reset.",
  "**Threat hunting:** sirf wohi file nahi, wohi behaviour dhundein taake variants milen."]],
 ["h", "Playbook 4 \u2014 Ransomware Investigation"],
 ["flow", ["Detection", "Host", "Process", "File activity", "Lateral", "Privilege", "SMB", "Domain", "Contain", "Isolate", "Preserve", "IR", "Recover"]],
 ["ol", [
  "**Pehli detection:** canary files, mass renames, ransom notes, EDR ransomware alert.",
  "**Mutasir host aur process ka jaiza:** kaun sa process encrypt kar raha hai, kis ne, kahan se shuru kiya?",
  "**File activity:** extension changes, raftaar, share paths; local disk hai ya network shares?",
  "**Lateral movement aur privilege escalation:** admin logons, nayi services (7045), remote execution, domain admin ka istemal.",
  "**SMB activity:** infected host se bohat se hosts par connections; admin shares tak access.",
  "**Domain par asar:** domain controller logs, GPO changes, account creation, backup server access.",
  "**Containment aur isolation:** pehle infected hosts, phir segments isolate; compromised accounts disable; jab tak hidayat na ho hosts **power off na karein**, kyunke memory mein ahem evidence hota hai.",
  "**Evidence ki hifazat:** ransom note, samples, EDR data, logs; chain of custody follow karein.",
  "**Incident response:** major incident declare; management, legal aur communications ko shamil karein.",
  "**Recovery:** verify karein backups saaf hain, dobara banayein, marhale war restore karein aur dobara dakhle ki nigrani karein."]],
 ["h", "Playbook 5 \u2014 Brute Force Investigation"],
 ["flow", ["Failures", "Source", "Target", "Frequency", "Pattern", "Success?", "Geo", "Accounts", "Spray?", "Block", "Escalate"]],
 ["ol", [
  "**Failed authentication events:** mutaliqa sources (domain controller, VPN, application) se sab failures jama karein.",
  "**Source IP aur target account:** har source aur har account ke hisab se ginein.",
  "**Frequency aur waqt ka pattern:** fi minute koshishen, baqaida waqfe, karobari ghante ya nahi.",
  "**Kamyab authentication:** failures ke baad usi source ya target account se koi success.",
  "**Geographic anomaly:** kya source ki jagah account ke normal istemal se mel khati hai?",
  "**Bohat se accounts aur spraying:** ek source se bohat accounts par har ek par kam koshish password spraying hai; ek account par bohat koshish brute force hai.",
  "**Blocking aur containment:** sources block, jahan success ka imkan ho accounts reset, MFA lazmi karein.",
  "**Escalation:** koi success, koi privileged account, ya phaila hua campaign."]],
 ["tbl", ["Pattern", "Har account par failures", "Accounts", "Mumkin wajah"], [
  ["Brute force", "Zyada", "Ek ya chand", "Ek ke baad ek password aazmana"],
  ["Password spraying", "Kam (1\u20133)", "Bohat", "Ek password bohat se users par"],
  ["Credential stuffing", "1\u20132", "Bohat, valid jode", "Leak hue credentials ka replay, aksar kai IPs se"],
  ["Benign", "Chand, phir success", "Ek", "User ne ghalat likha ya password expire; service ka purana password"]]],
 ["key", "Har playbook mein faislakun sawal yeh hain: **kya kamyab hua, isne kis cheez ko chhua, aur kitna phaila?**"]
]});

E.push({ id: "c-linlog", title: "Linux Log Reference", intro: "Linux events kahan likhta hai aur unhe kaise parhein.", blocks: [

E.push({ id: "c-ir", title: "Incident Response", intro: "Preparation se lessons learned tak ka lifecycle.", blocks: [

 ["tbl", ["Marhala", "Maqsad", "Aam amal"], [
  ["**Preparation**", "Kuch hone se pehle tayyar rehna.", "Playbooks, contacts, logging, backups, tools, mashqen."],
  ["**Identification**", "Tay karna ke incident ho raha hai ya nahi aur kitna bara hai.", "Triage, tasdeeq, scoping, shuruati severity."],
  ["**Containment**", "Phailao rokna aur nuqsan kam karna.", "Isolation, accounts disable, indicators block."],
  ["**Eradication**", "Wajah khatam karna.", "Malware hatayein, entry points band, patch, credentials badlein."],
  ["**Recovery**", "Mehfooz tareeqe se normal par aana.", "Restore, dobara banana, nigrani, marhale war reconnection."],

      $("#pb").style.width = "100%"; $("#pm").textContent = ed.ui.pdfDone.replace("{n}", r.pages);
      $("#pa").innerHTML = '<p><a class="btn pri" href="' + url + '" download="' + FILES[code] + '">' + esc(ed.ui.pdfAgain) + '</a> <button class="btn" id="pc">' + esc(ed.ui.close) + "</button></p>";
      $("#pc").onclick = () => m.remove();
    } catch (e) {
      console.error(e);
      $("#pm").textContent = "PDF could not be generated: " + e.message + " (you can also use Print > Save as PDF).";
      $("#pa").innerHTML = '<p><button class="btn" id="pc">' + esc(ed.ui.close) + '</button> <button class="btn pri" id="pp">Print</button></p>';
      $("#pc").onclick = () => m.remove(); $("#pp").onclick = () => window.print();
    }
    busy = false;
  }

  /* ---------- boot ---------- */
  const info = unlockInfo();
  const lang = params.get("lang");
  if (!info.unlocked) lockScreen(info);
  else if (lang === "en" || lang === "ur") startReader(lang, params.get("dl") === "1");
  else landing(info);
})();

</script>
</body>
</html>
